# Build the Noop relay from this checkout while retaining the base stack's data.
# Run with: docker compose -f docker-compose.yml -f docker-compose.noop.yml up -d --build
services:
  sub2api:
    image: noop-sub2api:local
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: 0.2.14-noop
    ports: !override
      - "${BIND_HOST:-127.0.0.1}:${SERVER_PORT:-55250}:8080"
    environment:
      RUN_MODE: simple
      # Every Noop user key is created under the single relay service user, so
      # the upstream per-user key caps would block provisioning past 200 users.
      API_KEY_CREATE_MAX_ACTIVE_PER_USER: "0"
      API_KEY_CREATE_MAX_PER_USER_PER_HOUR: "0"
